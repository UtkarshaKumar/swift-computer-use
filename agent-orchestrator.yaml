# Agent Orchestrator — Semantic Display Daemon
# Dashboard: http://localhost:3000
# Start:     ao start (from this directory)
#
# ── Spawn commands by agent ───────────────────────────────────────────────────
# Claude  (#1,#2):       ao spawn sdd 1 --agent claude-code
#                        ao spawn sdd 2 --agent claude-code
#
# Gemini  (#3,#4,#5):    ao spawn sdd 3 --agent gemini
#                        ao spawn sdd 4 --agent gemini
#                        ao spawn sdd 5 --agent gemini
#
# Minimax (#6,#7,#8):    ao spawn sdd 6 --agent opencode-minimax
#                        ao batch-spawn sdd 7 8 --agent opencode-minimax
#
# Kimi    (#9,#10,#11):  ao spawn sdd 9 --agent kimi
#                        ao batch-spawn sdd 10 11 --agent kimi
#
# Start Claude issue #1 first — it unblocks everyone else.
# ─────────────────────────────────────────────────────────────────────────────

port: 3000

defaults:
  runtime: tmux
  workspace: worktree
  agent: claude-code
  notifiers: [desktop]

projects:
  sdd:
    name: "Semantic Display Daemon"
    repo: UtkarshaKumar/semantic-display-daemon
    path: "~/Documents/Utkarsh 26 Workspace/BUILD/Semantic Display Daemon"
    defaultBranch: main
    sessionPrefix: sdd
    agentConfig:
      permissions: skip           # claude-code default
    reactions:
      ci-failed:
        auto: true
        retries: 2
        escalate-after: 2
      changes-requested:
        auto: true
        escalate-after: 30m
      approved-and-green:
        auto: false               # manual merge review
      agent-stuck:
        threshold: 15m
        action: notify

# ── Custom agent definitions ──────────────────────────────────────────────────
# These are referenced via --agent flag on ao spawn
agents:
  gemini:
    command: gemini               # native Gemini CLI v0.35.2
    processName: gemini

  kimi:
    command: kimi                 # native Kimi CLI v1.16.0
    processName: kimi

  opencode-minimax:
    command: opencode --model minimax-coding-plan/MiniMax-M2.5
    processName: opencode

  opencode-kimi:
    command: opencode --model kimi-for-coding/kimi-k2-thinking
    processName: opencode

notifiers:
  desktop:
    plugin: desktop

reactions:
  agent-needs-input:
    action: notify
    priority: urgent
  agent-idle-no-pr:
    threshold: 30m
    action: notify
    priority: warning
  all-complete:
    action: notify
    priority: info
    include-summary: true
